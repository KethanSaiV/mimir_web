# Push a tag like v0.1.0 -> builds MIMIR-Setup-0.1.0.exe and publishes a GitHub Release.
# Tags with a hyphen (v0.2.0-rc.1) are published as pre-releases.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Version from tag
        id: v
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"            # 0.2.0-rc.1
          base="${tag%%-*}"                      # 0.2.0 (must match __version__)
          grep -q "__version__ = \"$base\"" server.py || { echo "Tag $GITHUB_REF_NAME does not match __version__ in server.py"; exit 1; }
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          [[ "$tag" == *-* ]] && echo "pre=--prerelease" >> "$GITHUB_OUTPUT" || true

      # TotalSegmentator is not bundled; the app runs it through Docker.
      - name: Install
        shell: bash
        run: |
          grep -v TotalSegmentator requirements.txt > build-req.txt
          pip install -r build-req.txt pyinstaller

      - name: Build exe
        run: pyinstaller server.py --name MIMIR --onedir --noconsole --noconfirm --add-data "static:static" --icon installer/mimir.ico --collect-submodules uvicorn

      - name: Build installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc /DAppVersion=${{ steps.v.outputs.version }} installer\mimir.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} dist/MIMIR-Setup-${{ steps.v.outputs.version }}.exe --generate-notes ${{ steps.v.outputs.pre }}
